name: Release

# GitHub (Open330/agt) is the source of truth AND the release runner
# (.github/workflows/release.yml). Gitea mirrors the repo (jiunbae/agt) every
# 8h or via webhook and keeps this workflow as a MANUAL FALLBACK only — for
# when GitHub Actions is unavailable. It deliberately does not fire on tag
# pushes, so the two forges never publish the same tag concurrently.
#
# To use it: run it from the Gitea UI on the exact `v<version>` tag with
# dry_run=false and the version input set.
#
# Runners:
#   ubuntu-latest  Docker mode (jiun-mini). Linux jobs run inside the per-job
#                  container image declared below.
#   macos-arm64    Host mode (jiun-mini-macos). Native darwin-arm64 build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version (without leading v). Must match checked-in manifests.'
        required: false
      dry_run:
        description: 'Build only — skip npm publish and GitHub release upload.'
        required: false
        default: 'true'

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate checked-in release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          version="$(scripts/check-versions.sh "$RELEASE_VERSION_INPUT")"

          expected_ref="refs/tags/v$version"
          should_publish=false
          case "$RELEASE_EVENT" in
            push)
              if [ "$RELEASE_REF" != "$expected_ref" ]; then
                echo "Release tag '$RELEASE_REF' does not exactly match '$expected_ref'" >&2
                exit 1
              fi
              should_publish=true
              ;;
            workflow_dispatch)
              case "$RELEASE_DRY_RUN" in
                ''|true)
                  ;;
                false)
                  if [ -z "$RELEASE_VERSION_INPUT" ]; then
                    echo "Manual publication requires an explicit version input" >&2
                    exit 1
                  fi
                  if [ "$RELEASE_REF" != "$expected_ref" ]; then
                    echo "Manual publication requires the exact tag '$expected_ref'; got '$RELEASE_REF'" >&2
                    exit 1
                  fi
                  should_publish=true
                  ;;
                *)
                  echo "Invalid dry_run input '$RELEASE_DRY_RUN': expected true or false" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported release event '$RELEASE_EVENT'" >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "Validated release version: $version (publish=$should_publish)"

  build-darwin-arm64:
    needs: validate-version
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -smr
          rustup show
          rustup target add aarch64-apple-darwin

      - name: Build
        run: cargo build --release --manifest-path agt/Cargo.toml --target aarch64-apple-darwin

      - name: Stage outputs
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          mkdir -p out
          cp agt/target/aarch64-apple-darwin/release/agt out/agt
          file out/agt
          version_output="$(out/agt --version)"
          if [ "$version_output" != "agt $RELEASE_VERSION" ]; then
            echo "Binary version mismatch: expected 'agt $RELEASE_VERSION', got '$version_output'" >&2
            exit 1
          fi
          tar -C out -czf "out/agt-aarch64-apple-darwin.tar.gz" agt

      - uses: actions/upload-artifact@v3
        with:
          name: agt-darwin-arm64
          path: |
            out/agt
            out/agt-aarch64-apple-darwin.tar.gz

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest
    # Default container (catthehacker/ubuntu:act-latest) has node + apt + pip,
    # which JS actions need. We add rust + zig manually so the build can
    # cross-compile to musl from arm64 host with a single linker (zig).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux-x64
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Show env
        run: |
          uname -smr
          node --version
          which apt-get pip3 python3 curl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal \
                       -t ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Zig
        run: |
          ZIG_VER=0.13.0
          ARCH=$(uname -m)
          mkdir -p "$HOME/.local"
          curl -sSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-${ARCH}-${ZIG_VER}.tar.xz" \
            | tar -xJ -C "$HOME/.local"
          mv "$HOME/.local/zig-linux-${ARCH}-${ZIG_VER}" "$HOME/.local/zig"
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: Install cargo-zigbuild
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/zig:$PATH"
          cargo install --locked cargo-zigbuild

      - name: Build (zigbuild)
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/zig:$PATH"
          cargo zigbuild --release --manifest-path agt/Cargo.toml --target ${{ matrix.target }}

      - name: Stage outputs
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          mkdir -p out
          cp agt/target/${{ matrix.target }}/release/agt out/agt
          file out/agt
          case "$(uname -m)" in
            x86_64) runner_target=x86_64-unknown-linux-musl ;;
            aarch64|arm64) runner_target=aarch64-unknown-linux-musl ;;
            *) runner_target=unsupported ;;
          esac
          if [ "$runner_target" = "${{ matrix.target }}" ]; then
            version_output="$(out/agt --version)"
            if [ "$version_output" != "agt $RELEASE_VERSION" ]; then
              echo "Binary version mismatch: expected 'agt $RELEASE_VERSION', got '$version_output'" >&2
              exit 1
            fi
          else
            echo "Skipping executable version check for cross-built ${{ matrix.target }} on $(uname -m)."
          fi
          tar -C out -czf "out/agt-${{ matrix.target }}.tar.gz" agt

      - uses: actions/upload-artifact@v3
        with:
          name: agt-${{ matrix.platform }}
          path: |
            out/agt
            out/agt-${{ matrix.target }}.tar.gz

  publish-npm:
    needs: [validate-version, build-darwin-arm64, build-linux]
    runs-on: ubuntu-latest
    if: ${{ needs.validate-version.outputs.should_publish == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with: { name: agt-darwin-arm64, path: dl/darwin-arm64 }
      - uses: actions/download-artifact@v3
        with: { name: agt-linux-x64,    path: dl/linux-x64 }
      - uses: actions/download-artifact@v3
        with: { name: agt-linux-arm64,  path: dl/linux-arm64 }

      - name: Stage binaries into platform packages
        run: |
          # upload-artifact@v3 strips the common path prefix from the
          # uploaded list, so `out/agt` lands at `dl/<artifact>/agt`.
          for p in darwin-arm64 linux-x64 linux-arm64; do
            mkdir -p "npm/platforms/$p/bin"
            install -m 0755 "dl/$p/agt" "npm/platforms/$p/bin/agt"
          done
          ls -la npm/platforms/*/bin/agt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Granular access tokens (npm_mc... prefix) lack the user:read
          # scope that `npm whoami` requires, so the readback returns 401
          # even though publish itself succeeds. Skip the check; the
          # subsequent `npm publish` calls will surface auth errors.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -e
          V="$RELEASE_VERSION"
          for p in linux-x64 linux-arm64 darwin-arm64; do
            PKG="@open330/agt-$p"
            if npm view "$PKG@$V" version >/dev/null 2>&1; then
              echo "↩ skip $PKG@$V (already on registry)"
            else
              (cd "npm/platforms/$p" && npm publish --access public)
            fi
          done

      - name: Publish wrapper package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -e
          V="$RELEASE_VERSION"
          if npm view "@open330/agt@$V" version >/dev/null 2>&1; then
            echo "↩ skip @open330/agt@$V (already on registry)"
          else
            cd npm && npm publish --access public
          fi

      - name: Verify published platforms match optionalDependencies
        # Registry CDN can lag a few seconds after publish; retry with
        # backoff before declaring failure.
        run: |
          for i in 1 2 3 4 5 6; do
            if node npm/scripts/verify-platform-packages.js; then
              exit 0
            fi
            echo "verify attempt $i failed; waiting 10s for npm CDN propagation..."
            sleep 10
          done
          exit 1

  # Optional: create a GitHub release with tarballs so postinstall.js fallback
  # download path keeps working. Requires a personal access token with
  # `Contents: Read and write` on Open330/agt stored as GH_RELEASE_TOKEN
  # (fine-grained PAT). Skipped silently if the secret is absent.
  github-release:
    needs: [validate-version, build-darwin-arm64, build-linux, publish-npm]
    runs-on: ubuntu-latest
    if: ${{ needs.validate-version.outputs.should_publish == 'true' }}
    steps:
      - uses: actions/download-artifact@v3
        with: { name: agt-darwin-arm64, path: dl/darwin-arm64 }
      - uses: actions/download-artifact@v3
        with: { name: agt-linux-x64,    path: dl/linux-x64 }
      - uses: actions/download-artifact@v3
        with: { name: agt-linux-arm64,  path: dl/linux-arm64 }

      - name: Collect tarballs
        run: |
          mkdir -p release
          cp dl/*/*.tar.gz release/
          ls -la release/

      - name: Push tarballs to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_RELEASE_TOKEN secret not set on Gitea repo; skipping GitHub release upload."
            exit 0
          fi
          TAG="v$RELEASE_VERSION"
          REPO="Open330/agt"
          API_TMP="$(mktemp -d)"
          trap 'rm -rf -- "$API_TMP"' EXIT
          RELEASE_BODY="$API_TMP/release.json"

          LOOKUP_STATUS="$(curl --silent --show-error --location \
            --output "$RELEASE_BODY" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")"
          case "$LOOKUP_STATUS" in
            200)
              ;;
            404)
              CREATE_PAYLOAD="$(jq -nc --arg tag "$TAG" \
                '{tag_name:$tag,name:$tag,generate_release_notes:true}')"
              CREATE_STATUS="$(curl --silent --show-error --location \
                --output "$RELEASE_BODY" --write-out '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                --data "$CREATE_PAYLOAD" \
                "https://api.github.com/repos/$REPO/releases")"
              if [ "$CREATE_STATUS" != 201 ]; then
                echo "GitHub release creation failed with HTTP $CREATE_STATUS" >&2
                jq -r '.message // "Invalid JSON error response"' "$RELEASE_BODY" >&2 || true
                exit 1
              fi
              ;;
            *)
              echo "GitHub release lookup failed with HTTP $LOOKUP_STATUS" >&2
              jq -r '.message // "Invalid JSON error response"' "$RELEASE_BODY" >&2 || true
              exit 1
              ;;
          esac

          RID="$(jq -er --arg tag "$TAG" \
            'select((.id | type) == "number" and .id > 0 and .tag_name == $tag) | .id' \
            "$RELEASE_BODY")" || {
              echo "GitHub release response lacks a valid id/tag_name" >&2
              exit 1
            }
          UPLOAD_URL="$(jq -er \
            'select((.upload_url | type) == "string") | .upload_url | sub("\\{.*$"; "") | select(startswith("https://uploads.github.com/"))' \
            "$RELEASE_BODY")" || {
              echo "GitHub release response lacks a valid upload_url" >&2
              exit 1
            }
          if [ "$UPLOAD_URL" != "https://uploads.github.com/repos/$REPO/releases/$RID/assets" ]; then
            echo "GitHub release response returned an unexpected upload_url" >&2
            exit 1
          fi
          echo "GitHub release id: $RID"
          for f in release/*.tar.gz; do
            asset_name="$(basename "$f")"
            expected_download_url="https://github.com/$REPO/releases/download/$TAG/$asset_name"
            UPLOAD_BODY="$API_TMP/upload-$asset_name.json"
            UPLOAD_STATUS="$(curl --silent --show-error --location \
              --output "$UPLOAD_BODY" --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/gzip" \
              --data-binary "@$f" \
              "$UPLOAD_URL?name=$asset_name")"
            if [ "$UPLOAD_STATUS" != 201 ]; then
              echo "GitHub asset upload for '$asset_name' failed with HTTP $UPLOAD_STATUS" >&2
              jq -r '.message // "Invalid JSON error response"' "$UPLOAD_BODY" >&2 || true
              exit 1
            fi
            jq -er --arg name "$asset_name" --arg download_url "$expected_download_url" \
              'select(.name == $name and .browser_download_url == $download_url) | {name, browser_download_url}' \
              "$UPLOAD_BODY" || {
                echo "GitHub asset response for '$asset_name' lacks valid name/download fields" >&2
                exit 1
              }
          done
